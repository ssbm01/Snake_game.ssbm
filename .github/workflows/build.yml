name: Build Space Trails APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy Game Files and Icon
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/drawable
          cp index.html style.css script.js song.mp3 icon.png android/app/src/main/assets/
          cp icon.png android/app/src/main/res/drawable/ic_launcher.png

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpaceTrails-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
